<!DOCTYPE html>
<html lang="zh-Hant-TW">
<head>
<meta charset="UTF-8">
<link rel="icon" href="./favicon.ico" sizes="any">
<link rel="icon" type="image/png" sizes="32x32" href="./favicon-32.png">
<link rel="apple-touch-icon" sizes="180x180" href="./apple-touch-icon.png">
<meta name="msapplication-TileColor" content="#2a1710">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>光碼電台 ｜ 歲月恩典館（打樣 B 版・古早收音機）</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Noto+Serif+TC:wght@400;600;700;900&family=Noto+Sans+TC:wght@400;500;700&display=swap" rel="stylesheet">
<style>
:root{
  --wood-1:#2b180f; --wood-2:#4a2b19; --wood-3:#6b4026; --wood-4:#8a5733;
  --panel:#f3e5c6; --panel-2:#e7d2a6; --panel-ink:#33200f;
  --ink:#2a1a0e; --ink-soft:#5d4530;
  --paper:#f7edd6; --kraft:#d8bc8e;
  --red:#b23a2b; --red-deep:#8c281c;
  --gold:#c9a227; --gold-soft:#e8ce7a;
  --green:#8fd07a; --green-deep:#3f7a33;
  --line:#e7e7e7;
  --fs:18px;
  --serif:'Noto Serif TC',serif;
  --sans:'Noto Sans TC',system-ui,-apple-system,sans-serif;
}
body.large{--fs:22px}
*{box-sizing:border-box}
html,body{margin:0;padding:0}
body{
  font-family:var(--sans); font-size:var(--fs); color:var(--ink);
  background:
    radial-gradient(1200px 600px at 50% -10%, #4a2b19 0%, #2a1710 55%, #170d08 100%);
  min-height:100vh; padding:0 0 80px;
  -webkit-font-smoothing:antialiased;
}

/* ============ 打樣標示 ============ */
.demo-flag{
  position:fixed; right:14px; bottom:64px; z-index:99;
  background:var(--red); color:#fff; font-size:.72rem; letter-spacing:.12em;
  padding:8px 12px; border-radius:3px; box-shadow:0 6px 18px rgba(0,0,0,.45);
  font-weight:700; opacity:.92;
}

/* ============ 木殼機身 ============ */
.case-wrap{max-width:1180px; margin:0 auto; padding:26px 16px 0}
.radio-case{
  position:relative; border-radius:22px; padding:20px 22px 16px;
  background:
    repeating-linear-gradient(90deg, rgba(0,0,0,.10) 0 2px, transparent 2px 7px),
    repeating-linear-gradient(88deg, rgba(255,255,255,.045) 0 1px, transparent 1px 11px),
    linear-gradient(160deg,#6b4026 0%,#4a2b19 42%,#3a2113 70%,#54301c 100%);
  box-shadow:
    inset 0 2px 0 rgba(255,214,150,.28),
    inset 0 -3px 10px rgba(0,0,0,.6),
    0 26px 60px rgba(0,0,0,.55),
    0 3px 0 #1a0d07;
  border:1px solid #2a1710;
}
.radio-case::after{ /* 木紋高光 */
  content:""; position:absolute; inset:0; border-radius:22px; pointer-events:none;
  background:linear-gradient(115deg, rgba(255,220,170,.10) 0%, transparent 32%, transparent 72%, rgba(255,220,170,.05) 100%);
}
.nameplate{
  display:flex; align-items:center; justify-content:space-between; gap:16px; margin-bottom:14px;
}
.brand{display:flex; align-items:baseline; gap:12px; flex-wrap:wrap}
.brand h1{
  font-family:var(--serif); font-weight:900; font-size:clamp(1.5rem,3.4vw,2.15rem);
  margin:0; letter-spacing:.14em; color:#f6e3bd;
  text-shadow:0 1px 0 #2a1710, 0 -1px 0 rgba(255,240,200,.35), 0 4px 10px rgba(0,0,0,.5);
}
.brand .band{
  font-family:var(--serif); font-size:.72rem; letter-spacing:.3em; color:var(--gold-soft);
  border:1px solid rgba(233,206,122,.5); padding:3px 8px; border-radius:2px; white-space:nowrap;
}
.onair{display:flex; align-items:center; gap:8px; font-size:.68rem; letter-spacing:.22em; color:#f0dcb4; font-weight:700}
.lamp{
  width:13px; height:13px; border-radius:50%;
  background:radial-gradient(circle at 35% 32%, #ffb9a8, #c0392b 45%, #5c1108 100%);
  box-shadow:0 0 0 2px rgba(0,0,0,.35), 0 0 10px rgba(255,80,50,.55);
  animation:breathe 2.4s ease-in-out infinite;
}
@keyframes breathe{0%,100%{opacity:.55; box-shadow:0 0 0 2px rgba(0,0,0,.35),0 0 6px rgba(255,80,50,.35)}50%{opacity:1; box-shadow:0 0 0 2px rgba(0,0,0,.35),0 0 16px rgba(255,90,55,.7)}}

/* ============ 刻度盤 ============ */
.dial-frame{
  position:relative; border-radius:12px; padding:9px;
  background:linear-gradient(180deg,#20130b,#3a2113 40%,#1c1008);
  box-shadow:inset 0 2px 5px rgba(0,0,0,.8), 0 1px 0 rgba(255,220,170,.18);
}
.dial{
  position:relative; border-radius:8px; overflow:hidden;
  background:
    linear-gradient(180deg,#f7ecd0 0%, #efdfba 46%, #e3ceA1 100%);
  box-shadow:inset 0 0 0 1px rgba(120,84,40,.45), inset 0 8px 16px rgba(120,84,40,.22);
  padding:14px 18px 10px;
}
.dial::after{ /* 玻璃反光 */
  content:""; position:absolute; inset:0; pointer-events:none;
  background:linear-gradient(103deg, rgba(255,255,255,.42) 0%, rgba(255,255,255,.06) 20%, transparent 42%);
}
.dial-top{display:flex; justify-content:space-between; align-items:center; font-family:var(--serif); font-size:.66rem; letter-spacing:.26em; color:#7a5a33; font-weight:700}
.stations{position:relative; display:grid; grid-template-columns:repeat(10,1fr); gap:2px; margin-top:8px}
.station{
  position:relative; background:none; border:0; cursor:pointer; padding:26px 0 10px;
  font-family:var(--serif); color:#5b3d20; transition:color .2s;
}
.station .num{display:block; font-size:.95rem; font-weight:700; letter-spacing:.06em; line-height:1}
.station .tick{position:absolute; left:50%; bottom:2px; width:1px; height:7px; background:#8a6636; transform:translateX(-50%)}
.station.on{background:linear-gradient(180deg,transparent 30%, rgba(178,58,43,.10) 100%)}
.station.on .num{color:var(--red-deep); font-size:1.12rem; text-shadow:0 0 12px rgba(178,58,43,.25)}
.station.on .tick{background:var(--red-deep); width:2px}
.station:hover .num{color:var(--red)}
.station .cat{display:block; font-size:.6rem; letter-spacing:.08em; color:#8a6636; margin-top:3px; opacity:.85}
@media (max-width:820px){ .station .cat{display:none} .station{padding-top:20px} }
.needle{
  position:absolute; bottom:0; height:calc(100% - 46px); width:3px; background:var(--red);
  box-shadow:0 0 8px rgba(255,60,40,.85), 0 0 2px #fff;
  transition:left .55s cubic-bezier(.4,1.5,.5,1); border-radius:2px; pointer-events:none;
}
.needle::before{content:""; position:absolute; top:-4px; left:-4px; width:11px; height:11px; border-radius:50%; background:var(--red); box-shadow:0 0 10px rgba(255,60,40,.8)}

/* ============ 喇叭 + 旋鈕 ============ */
.deck{display:grid; grid-template-columns:1.1fr 1fr; gap:14px; margin-top:14px}
@media (max-width:820px){ .deck{grid-template-columns:1fr} }
.grille{
  border-radius:10px; min-height:112px; position:relative; overflow:hidden;
  background:
    repeating-linear-gradient(90deg, rgba(0,0,0,.35) 0 2px, transparent 2px 9px),
    linear-gradient(180deg,#cbb182,#a98c5c);
  box-shadow:inset 0 0 0 2px rgba(30,18,10,.55), inset 0 0 26px rgba(60,36,16,.55);
  display:flex; align-items:flex-end; justify-content:space-between; padding:10px 14px;
}
.grille .magic-eye{
  width:44px; height:44px; border-radius:50%;
  background:radial-gradient(circle at 50% 50%, #d9ffc4 0%, #7fc06a 26%, #2f6b28 62%, #10240c 100%);
  box-shadow:inset 0 0 10px #000, 0 0 14px rgba(120,220,100,.28);
  opacity:.35; transition:opacity .4s;
}
.playing .grille .magic-eye{opacity:1; box-shadow:inset 0 0 10px #000, 0 0 24px rgba(140,240,120,.75); animation:eye 1.6s ease-in-out infinite}
@keyframes eye{0%,100%{transform:scale(1)}50%{transform:scale(1.05)}}
.grille .plate{
  font-family:var(--serif); font-size:.56rem; letter-spacing:.2em; color:#e8d3a9; white-space:nowrap;
  background:linear-gradient(180deg,#3a2113,#241409); padding:4px 9px 3px; border-radius:2px;
  box-shadow:inset 0 1px 0 rgba(255,220,170,.25), 0 2px 6px rgba(0,0,0,.5);
}
.knob-panel{
  border-radius:10px; padding:12px 14px; display:flex; align-items:center; justify-content:space-around; gap:10px;
  background:linear-gradient(180deg,#3a2113,#26150c);
  box-shadow:inset 0 2px 6px rgba(0,0,0,.8), inset 0 -1px 0 rgba(255,220,170,.12);
}
.knob{display:flex; flex-direction:column; align-items:center; gap:6px; background:none; border:0; cursor:pointer; color:#e8d3a9}
.knob .dial-face{
  width:54px; height:54px; border-radius:50%; position:relative;
  background:
    radial-gradient(circle at 38% 32%, #6b4026 0%, #3a2113 62%, #1a0d07 100%);
  box-shadow:inset 0 2px 4px rgba(255,220,170,.28), inset 0 -4px 8px rgba(0,0,0,.7), 0 4px 10px rgba(0,0,0,.5);
  transition:transform .5s cubic-bezier(.34,1.56,.64,1);
}
.knob .dial-face::before{ /* 指針記號 */
  content:""; position:absolute; left:50%; top:5px; width:2px; height:14px;
  background:linear-gradient(180deg,#f3e5c6,#8a6636); transform:translateX(-50%); border-radius:1px;
}
.knob .dial-face::after{ /* 中心鉚釘 */
  content:""; position:absolute; inset:50% auto auto 50%; width:9px; height:9px; margin:-4.5px 0 0 -4.5px;
  border-radius:50%; background:radial-gradient(circle at 35% 32%,#f3e5c6,#8a6636);
}
.knob.big .dial-face{width:72px; height:72px; background:radial-gradient(circle at 38% 32%,#8a5733 0%,#4a2b19 60%,#1a0d07 100%)}
.knob.big .dial-face::before{height:20px}
.knob span{font-size:.66rem; letter-spacing:.14em; font-weight:700}
.knob:active .dial-face{transform:scale(.96)}
.knob.disabled{opacity:.35; pointer-events:none}

/* ============ 節目資訊 ============ */
.now{
  max-width:1180px; margin:22px auto 0; padding:0 16px;
}
.slip{
  background:linear-gradient(180deg,#f7ecd0,#efe0bb);
  border-radius:4px; padding:18px 22px 20px; position:relative;
  box-shadow:0 12px 30px rgba(0,0,0,.45), inset 0 0 0 1px rgba(120,84,40,.3);
}
.slip::before{ /* 打孔邊 */
  content:""; position:absolute; left:0; right:0; top:0; height:7px;
  background:radial-gradient(circle at 6px 0, transparent 5px, #f3e5c6 5.5px) repeat-x;
  background-size:12px 7px; opacity:.0;
}
.meta-row{display:flex; align-items:center; gap:12px; flex-wrap:wrap; font-size:.72rem; letter-spacing:.18em; color:#8a6636; font-family:var(--serif); font-weight:700}
.chan-no{
  display:inline-flex; align-items:center; justify-content:center; min-width:56px; height:34px; padding:0 10px;
  background:var(--red); color:#fff8ec; border-radius:3px; font-size:1.02rem; letter-spacing:.06em;
  box-shadow:0 3px 0 var(--red-deep), 0 6px 14px rgba(0,0,0,.28);
}
h2.title{
  font-family:var(--serif); font-weight:900; line-height:1.45; letter-spacing:.02em;
  font-size:clamp(1.28rem,2.6vw,1.85rem); margin:12px 0 6px; color:var(--ink);
}
.excerpt{color:var(--ink-soft); font-size:.95rem; line-height:1.85; margin:0}

/* ============ 聲音條 ============ */
.player{
  margin-top:16px; display:flex; align-items:center; gap:12px; flex-wrap:wrap;
  background:linear-gradient(180deg,#2f1c10,#1e1009); border-radius:100px; padding:8px 14px 8px 8px;
  box-shadow:inset 0 2px 8px rgba(0,0,0,.7);
}
.player .go{
  width:46px; height:46px; border-radius:50%; border:0; cursor:pointer; flex:0 0 auto;
  background:radial-gradient(circle at 36% 30%,#e9cf9a,#c9a227 45%,#8a6636 100%);
  color:#2a1a0e; font-size:1.1rem; box-shadow:0 4px 12px rgba(0,0,0,.5), inset 0 1px 0 rgba(255,255,255,.6);
}
.player .go:active{transform:scale(.95)}
.player .wave{flex:1 1 160px; height:26px; display:flex; align-items:center; gap:2px; min-width:120px}
.player .wave i{flex:1; background:linear-gradient(180deg,var(--gold-soft),#8a6636); height:20%; border-radius:1px; opacity:.5; transition:height .12s}
.playing .player .wave i{opacity:1}
.player .t{font-family:var(--serif); font-size:.72rem; color:#d8bc8e; letter-spacing:.1em; white-space:nowrap}

/* ============ 雙欄：故事 + 工商服務 ============ */
.main{max-width:1180px; margin:22px auto 0; padding:0 16px; display:grid; grid-template-columns:1.35fr .95fr; gap:20px; align-items:start}
@media (max-width:940px){ .main{grid-template-columns:1fr} }

.layer{
  background:var(--paper); border-radius:4px; padding:18px 20px; margin-bottom:14px;
  box-shadow:0 8px 22px rgba(0,0,0,.35), inset 0 0 0 1px rgba(120,84,40,.22);
  line-height:2; font-size:.97rem; color:#33230f; position:relative;
}
.layer .tag{
  display:inline-block; font-family:var(--serif); font-size:.64rem; letter-spacing:.28em;
  color:#8a6636; border-bottom:1px solid rgba(138,102,54,.4); padding-bottom:2px; margin-bottom:10px; font-weight:700;
}
.layer.speaking{background:#fff9ea; box-shadow:0 8px 26px rgba(0,0,0,.4), 0 0 0 2px rgba(201,162,39,.55)}
.scripture{
  background:linear-gradient(180deg,#2f1c10,#241409); color:#f0dcb4; border-radius:4px;
  padding:16px 18px; font-family:var(--serif); line-height:1.95; font-size:.92rem;
  border-left:3px solid var(--gold); margin-bottom:14px; letter-spacing:.02em;
}

/* ============ 工商服務卡 ============ */
.ad-card{
  position:relative; border-radius:4px; padding:20px 20px 22px;
  background:
    repeating-linear-gradient(0deg, rgba(120,84,40,.05) 0 1px, transparent 1px 4px),
    linear-gradient(165deg,#e6cda2,#d8bc8e 55%,#cbae7e);
  box-shadow:0 14px 34px rgba(0,0,0,.45), inset 0 0 0 1px rgba(90,55,25,.35);
  transform:rotate(-.5deg);
}
.ad-card .ad-label{
  font-family:var(--serif); font-size:.66rem; letter-spacing:.34em; color:#7a5a33; font-weight:700;
  border-bottom:2px solid rgba(122,90,51,.45); padding-bottom:6px; margin-bottom:12px;
}
.stamp{
  position:absolute; right:14px; top:12px; width:64px; height:64px; border-radius:50%;
  border:2px solid rgba(178,58,43,.75); color:rgba(178,58,43,.85);
  display:flex; align-items:center; justify-content:center; text-align:center;
  font-family:var(--serif); font-weight:900; font-size:.62rem; line-height:1.15; letter-spacing:.06em;
  transform:rotate(12deg); opacity:.9;
}
.ad-title{font-family:var(--serif); font-weight:900; font-size:1.06rem; line-height:1.5; margin:0 0 10px; padding-right:56px; color:#3a2113}
.price{
  font-family:var(--serif); font-weight:900; color:var(--red-deep); font-size:1.42rem;
  letter-spacing:.02em; margin:6px 0 4px;
}
.price small{font-family:var(--sans); font-size:.68rem; color:#6b4a28; font-weight:500; letter-spacing:0}
.feats{list-style:none; margin:12px 0 16px; padding:0}
.feats li{font-size:.84rem; line-height:1.75; color:#4a3116; padding-left:16px; position:relative}
.feats li::before{content:"◆"; position:absolute; left:0; color:var(--red); font-size:.6rem; top:.45em}
.buy{
  display:block; width:100%; text-align:center; text-decoration:none; cursor:pointer;
  background:var(--red); color:#fff6e6; border:0; border-radius:3px; padding:14px 10px;
  font-family:var(--serif); font-weight:900; font-size:1rem; letter-spacing:.1em;
  box-shadow:0 4px 0 var(--red-deep), 0 10px 20px rgba(0,0,0,.3);
}
.buy:active{transform:translateY(2px); box-shadow:0 2px 0 var(--red-deep)}
.buy-note{font-size:.72rem; color:#6b4a28; text-align:center; margin:10px 0 0; line-height:1.7}
.pray-card{
  border-radius:4px; padding:22px; text-align:center;
  background:linear-gradient(165deg,#e8f2e2,#cfe3c6); color:#27401f;
  box-shadow:0 14px 34px rgba(0,0,0,.35), inset 0 0 0 1px rgba(60,100,50,.3);
}
.pray-card h3{font-family:var(--serif); margin:0 0 10px; font-size:1.04rem}
.pray-card p{font-size:.86rem; line-height:1.85; margin:0 0 16px; color:#3a5630}
.pray-card .buy{background:#3f7a33; box-shadow:0 4px 0 #28501f, 0 10px 20px rgba(0,0,0,.25)}

.foot{
  max-width:1180px; margin:26px auto 0; padding:0 16px; color:#c8ab84; font-size:.76rem;
  text-align:center; letter-spacing:.08em; line-height:1.9;
}
.toolbar{max-width:1180px; margin:0 auto; padding:12px 16px 0; display:flex; gap:8px; justify-content:flex-end; flex-wrap:wrap}
.toolbar button{
  background:rgba(243,229,198,.12); color:#e8d3a9; border:1px solid rgba(232,211,169,.4);
  border-radius:100px; padding:7px 14px; font-size:.74rem; letter-spacing:.1em; cursor:pointer;
  font-family:var(--sans);
}
.toolbar button:hover{background:rgba(243,229,198,.24)}
</style>
</head>
<body>

<div class="demo-flag">打樣 B 版・古早收音機</div>

<div class="toolbar">
  <button onclick="document.body.classList.toggle('large')">🔍 長輩大字</button>
  <button onclick="toggleSpeech()">🗣️ 分段朗讀</button>
</div>

<div class="case-wrap">
  <div class="radio-case" id="case">
    <div class="nameplate">
      <div class="brand">
        <h1>光碼電台</h1>
        <span class="band">歲月恩典館・AM 1080</span>
      </div>
      <div class="onair"><span class="lamp"></span><span>ON AIR</span></div>
    </div>

    <div class="dial-frame">
      <div class="dial" id="dial">
        <div class="dial-top"><span>頻　道　選　台</span><span id="dialHint">轉旋鈕，聽故事</span></div>
        <div class="stations" id="stations"></div>
        <div class="needle" id="needle" style="left:0"></div>
      </div>
    </div>

    <div class="deck">
      <div class="grille">
        <div class="plate">GRACE RADIO</div>
        <div class="magic-eye"></div>
      </div>
      <div class="knob-panel">
        <button class="knob" id="prevBtn"><div class="dial-face"></div><span>◀ 上一篇</span></button>
        <button class="knob big" id="playBtn"><div class="dial-face"></div><span>▶ 播放</span></button>
        <button class="knob" id="nextBtn"><div class="dial-face"></div><span>下一篇 ▶</span></button>
        <button class="knob" id="randBtn"><div class="dial-face"></div><span>🎲 隨機</span></button>
      </div>
    </div>
  </div>
</div>

<div class="now">
  <div class="slip">
    <div class="meta-row">
      <span class="chan-no" id="chanNo">#05</span>
      <span id="catName">🕊️ 平安 ｜ 晨更與好眠</span>
      <span style="margin-left:auto; color:#8a6636;">🎙 阿光 主持</span>
    </div>
    <h2 class="title" id="stTitle">—</h2>
    <p class="excerpt" id="stExcerpt">—</p>
    <div class="player">
      <button class="go" id="goBtn">▶</button>
      <div class="wave" id="wave"></div>
      <span class="t" id="timeTxt">00:00 / 00:00</span>
      <label class="t" style="display:flex;align-items:center;gap:5px;cursor:pointer">
        <input type="checkbox" id="autoNext" checked style="accent-color:#c9a227">聽完連播
      </label>
    </div>
  </div>
</div>

<div class="main">
  <div id="storyCol"></div>
  <div id="adCol"></div>
</div>

<div class="foot">
  光碼電台 ｜ 歲月恩典館　·　本頁為古早收音機版打樣　·　內容僅供樣張審閱
</div>

<script>
const STORIES = [
{
"id": "couple-love",
"categoryKey": "love",
"categoryName": "❤️ 01. 愛 ｜ 夫妻相守",
"mp3File": "././mp3/ep01.mp3",
"title": "結婚五十週年的那杯熱芝麻拿鐵：輕度失智的林伯伯忘了日期，卻沒忘記幫老伴溫牛奶",
"excerpt": "記憶會隨歲月慢慢變淡，但刻在骨子裡的愛不會。每天早上七點，林伯伯依然站在廚房為結縭半世紀的妻子泡一杯溫熱的芝麻拿鐵。",

let idx = 0;

let actx = null;

const $ = s => document.querySelector(s);

/* ---------- 電台雜訊（切台 0.35 秒） ---------- */
function noiseBurst(){
  try{
    actx = actx || new (window.AudioContext||window.webkitAudioContext)();
    const dur = 0.35, sr = actx.sampleRate;
    const buf = actx.createBuffer(1, sr*dur, sr);
    const d = buf.getChannelData(0);
    for(let i=0;i<d.length;i++){
      const env = Math.min(1, i/(sr*0.02)) * Math.max(0, 1 - i/(sr*dur));
      d[i] = (Math.random()*2-1) * 0.35 * env;
    }
    const src = actx.createBufferSource(); src.buffer = buf;
    const bp = actx.createBiquadFilter(); bp.type='bandpass'; bp.frequency.value=1800; bp.Q.value=0.7;
    const g = actx.createGain(); g.gain.value = 0.5;
    src.connect(bp).connect(g).connect(actx.destination); src.start();
  }catch(e){}
}

    const b = document.createElement('button');
    b.className = 'station' + (i===idx?' on':'');
    b.innerHTML = `<span class="num">${String(s.sort||i+1).padStart(2,'0')}</span>
                   <span class="cat">${(s.categoryName||'').replace(/^[^\s]+\s/,'').slice(0,4)}</span>
                   <span class="tick"></span>`;
    b.onclick = ()=>select(i,true);
    wrap.appendChild(b);
  });
}
function moveNeedle(){
  const st = document.querySelectorAll('.station');
  const n = st[idx], dial = $('#dial');
  if(!n) return;
  const r = n.getBoundingClientRect(), dr = dial.getBoundingClientRect();
  $('#needle').style.left = (r.left - dr.left + r.width/2) + 'px';
}

/* ---------- 選台 ---------- */
function select(i, withNoise){
  if(withNoise) noiseBurst();
  idx = (i + STORIES.length) % STORIES.length;
  const s = STORIES[idx];
  document.querySelectorAll('.station').forEach((el,k)=>el.classList.toggle('on', k===idx));
  moveNeedle();

  $('#chanNo').textContent = '#' + String(s.sort||idx+1).padStart(2,'0');
  $('#catName').textContent = s.categoryName || '';
  $('#stTitle').textContent = s.title || '';
  $('#stExcerpt').textContent = s.excerpt || '';

  $('#storyCol').innerHTML = `
    <div class="layer" data-i="0"><span class="tag">第 一 段・故事的起頭</span><br>${s.layer1||''}</div>
    <div class="layer" data-i="1"><span class="tag">第 二 段・故事的轉彎</span><br>${s.layer2||''}</div>
    ${s.hasProduct ? `<div class="layer" data-i="2"><span class="tag">第 三 段・工商服務</span><br>${s.layer3||''}</div>` : ''}
    <div class="scripture">${s.scripture||''}</div>`;

  renderAd(s);
  loadAudio(s);
  syncButtons();
}

function renderAd(s){
  const col = $('#adCol');
  if(s.hasProduct && s.product){
    const p = s.product;
    col.innerHTML = `
      <div class="ad-card">
        <div class="stamp">今天<br>有貨</div>
        <div class="ad-label">工 商 服 務 時 間</div>
        <h3 class="ad-title">${p.title||''}</h3>
        <div style="font-size:.78rem;color:#6b4a28;letter-spacing:.06em">${p.tag||''}</div>
        <div class="price">${p.price||''}</div>
        <ul class="feats">${(p.features||[]).map(f=>`<li>${f}</li>`).join('')}</ul>
        <a class="buy" href="#" onclick="return false;">💬 加 LINE 好友・用 LINE Pay 帶回家</a>
        <p class="buy-note">打樣頁不導購，正式站接 LINE 官方帳號</p>
      </div>`;
  }else{
    col.innerHTML = `
      <div class="pray-card">
        <h3>🙏 這一集，先送祝福</h3>
        <p>這一篇沒有要賣東西。你可以留一句話，或加 LINE 好友，新故事上架時，我們用電台通知你。</p>
        <a class="buy" href="#" onclick="return false;">💬 加 LINE 好友・免費收聽新故事</a>
        <p class="buy-note">打樣頁不導購</p>
      </div>`;
  }
}

/* ---------- 音檔 ---------- */
function loadAudio(s){
  audio.pause();
  const src = s.mp3File || '';
  audio = new Audio();
  audio.src = src;
  audio.onloadedmetadata = ()=>{ updateTime(); };
  audio.ontimeupdate = updateTime;
  audio.onended = ()=>{ document.body.classList.remove('playing'); $('#goBtn').textContent='▶'; if($('#autoNext').checked) select(idx+1,true); };
  audio.onerror = ()=>{ $('#timeTxt').textContent = '本集音檔錄製中・可先讀下面文字'; $('#goBtn').style.opacity='.4'; $('#goBtn').style.cursor='not-allowed'; };
  $('#goBtn').textContent = '▶';
  $('#goBtn').style.opacity='1'; $('#goBtn').style.cursor='pointer';
  document.body.classList.remove('playing');
}

function fmt(t){ if(!isFinite(t)) return '00:00'; const m=Math.floor(t/60), s=Math.floor(t%60); return String(m).padStart(2,'0')+':'+String(s).padStart(2,'0'); }
function updateTime(){ $('#timeTxt').textContent = fmt(audio.currentTime)+' / '+fmt(audio.duration); }

function togglePlay(){
  if(!audio.src) return;
  if(audio.paused){ audio.play().catch(()=>{}); document.body.classList.add('playing'); $('#goBtn').textContent='⏸'; spin($('#playBtn')); }
  else { audio.pause(); document.body.classList.remove('playing'); $('#goBtn').textContent='▶'; }
}
function spin(knob){ const f = knob.querySelector('.dial-face'); f.style.transform = 'rotate(' + (Math.random()*220+60) + 'deg)'; }

/* ---------- 逐段朗讀 ---------- */
function toggleSpeech(){
  speechOn = !speechOn;
  if(!speechOn){ speechSynthesis.cancel(); document.querySelectorAll('.layer.speaking').forEach(e=>e.classList.remove('speaking')); return; }
  speakLayers(0);
}
function speakLayers(i){
  const layers = document.querySelectorAll('#storyCol .layer');
  if(!speechOn || i>=layers.length) return;
  document.querySelectorAll('.layer.speaking').forEach(e=>e.classList.remove('speaking'));
  layers[i].classList.add('speaking');
  const u = new SpeechSynthesisUtterance(layers[i].innerText);
  u.lang='zh-TW'; u.rate=0.9;
  u.onend = ()=> speakLayers(i+1);
  speechSynthesis.speak(u);
}

/* ---------- 按鈕 ---------- */
function syncButtons(){
  $('#prevBtn').classList.toggle('disabled', idx===0);
  $('#nextBtn').classList.toggle('disabled', idx===STORIES.length-1);
}
$('#prevBtn').onclick = ()=>{ spin($('#prevBtn')); select(idx-1,true); };
$('#nextBtn').onclick = ()=>{ spin($('#nextBtn')); select(idx+1,true); };
$('#randBtn').onclick = ()=>{ spin($('#randBtn')); select(Math.floor(Math.random()*STORIES.length),true); };
$('#playBtn').onclick = togglePlay;
$('#goBtn').onclick = togglePlay;

/* 波形條 */
(function(){
  const w = $('#wave');
  for(let i=0;i<40;i++){ const b=document.createElement('i'); b.style.height=(12+Math.random()*70)+'%'; w.appendChild(b); }
  setInterval(()=>{
    if(!document.body.classList.contains('playing')) return;
    [...w.children].forEach(b=> b.style.height = (18+Math.random()*78)+'%');
  }, 130);
})();

window.addEventListener('resize', moveNeedle);
window.addEventListener('load', ()=>setTimeout(moveNeedle, 60));
if(document.fonts && document.fonts.ready) document.fonts.ready.then(()=>setTimeout(moveNeedle, 60));
buildDial();
select(4, false);
setTimeout(moveNeedle, 300);
</script>
</body>
</html>

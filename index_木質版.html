    0 0 0 2px #e0bd68, 0 0 0 4px #7a5227, 0 0 0 5px rgba(0,0,0,.55),
    inset 0 4px 10px rgba(120,84,40,.32), 0 12px 24px rgba(0,0,0,.55) !important;
}
.minidial button{color:#6b4a24 !important}
.minidial button.on{color:#a8321f !important}
.minidial button i{background:#b08a52 !important}

/* 篩選 */
.chip{
  background:linear-gradient(180deg,#fdf7e9,#e9d7b0) !important;
  border:1px solid #b98f4a !important; color:#4a2f18 !important; font-weight:700;
  box-shadow:0 2px 0 rgba(90,60,25,.5), 0 5px 12px rgba(0,0,0,.38) !important;
}
.chip.on{
  background:linear-gradient(180deg,#cf5243,#a02a1e) !important;
  border-color:#7a1f14 !important; color:#fff6e6 !important;
  box-shadow:0 3px 0 #6d1a10, 0 7px 16px rgba(0,0,0,.45) !important;
}

/* 卡片 */
.card{
  background:linear-gradient(180deg,#fdf7e9,#f2e5cb) !important;
  border:1px solid rgba(120,84,40,.4) !important;
  box-shadow:0 10px 24px rgba(0,0,0,.55), inset 0 1px 0 rgba(255,255,255,.75) !important;
}

/* 底部木條：也吃同一塊木頭，只壓暗一點 */
.tabbar{
  background-color:#3a2213 !important;
  background-image:linear-gradient(180deg, rgba(20,10,4,.45), rgba(14,7,3,.62)), var(--wood) !important;
  background-size:auto, 250px auto !important;
  background-repeat:repeat, repeat !important;
  border-top:2px solid var(--brass) !important;
  box-shadow:0 -8px 22px rgba(0,0,0,.6) !important;
}
.tabbar .tab{color:#e8ceA0 !important; text-shadow:0 1px 3px rgba(0,0,0,.8)}
.tabbar .tab.on{color:#ffe9b8 !important}
.playerbar{
  background-color:#3a2213 !important;
  background-image:linear-gradient(180deg, rgba(20,10,4,.55), rgba(14,7,3,.75)), var(--wood) !important;
  background-size:auto, 250px auto !important;
  border-top:1px solid var(--brass) !important;
}

/* 故事頁與商品頁 */
.page{
  background-color:#20130a !important;
  background-image:linear-gradient(180deg, rgba(16,9,4,.72), rgba(16,9,4,.86)), var(--wood) !important;
  background-size:auto, 380px auto !important;
}
.page .head{
  background-color:#3a2213 !important;
  background-image:linear-gradient(180deg, rgba(24,13,6,.55), rgba(24,13,6,.7)), var(--wood) !important;
  background-size:auto, 250px auto !important;
  border-bottom:2px solid var(--brass) !important;
}
.sthead{background:linear-gradient(180deg,#fdf7e9,#f2e5cb) !important; border:1px solid rgba(120,84,40,.4)}

.sharebtn{
  background:linear-gradient(180deg,#fdf7e9,#e9d7b0) !important;
  border:1px solid #b98f4a !important; color:#4a2f18 !important;
  box-shadow:0 2px 0 rgba(90,60,25,.5) !important;
}
.layer{background:linear-gradient(180deg,#fdf7e9,#f9f0de) !important; box-shadow:0 8px 22px rgba(0,0,0,.5) !important}
.pcard{background:linear-gradient(180deg,#fdf7e9,#f2e5cb) !important}
.aabtn{
  background:linear-gradient(180deg,#f7e6b4,#c9a227 60%,#9c7a1f) !important;
  color:#2a1710 !important; border:1px solid #8a6636 !important;
  box-shadow:0 2px 0 #6b4f14, 0 5px 12px rgba(0,0,0,.45) !important;
}
</style>
</head>
<body>
<div class="wrap">

  <header class="bar">
    <div class="bar-row">
      <span class="onair"><i class="lamp"></i>ON AIR</span>
      <span class="name">恩典電台</span>
      <span class="no" id="curNo">未播</span>
    </div>
    <div class="tickrow">
      <div class="ticker" id="ticker">滑一下，十個頻道，二百個故事</div>
      <button class="aabtn" id="aabtn">字體</button>
    </div>
    <div class="minidial" id="minidial"></div>
    <div class="chips" id="chips"></div>
  </header>



  <main id="view"></main>

  <div class="playerbar" id="playerbar">
    <div class="cover"></div>
    <div class="txt"><b id="pbTitle">—</b><span id="pbTime">00:00</span></div>
    <button id="pbPlay">⏸</button>
    <div class="seek" id="pbSeek"></div>
  </div>

  <nav class="tabbar">
    <button class="tab on" data-tab="feed"><span class="ico">📻</span>聽故事</button>
    <button class="tab" data-tab="shop"><span class="ico">🛍️</span>逛好物</button>
    <button class="tab" data-tab="about"><span class="ico">🙏</span>關於</button>
  </nav>
</div>

<!-- 故事內頁 -->
<div class="page" id="storyPage">
  <div class="head"><button class="back" onclick="closePage()">‹</button><span class="t" id="pageTitle">故事</span></div>
  <div class="inner" id="storyBody"></div>
</div>

<!-- 商品內頁 -->
<div class="page" id="productPage">
  <div class="head"><button class="back" onclick="closePage()">‹</button><span class="t">好物</span></div>
  <div class="inner" id="productBody"></div>
</div>

<div class="fixcta" id="fixcta"><button onclick="lineCta()">💬 加 LINE 好友・用 LINE Pay 帶回家</button></div>

<script>
/* ================= 資料 ================= */
let STORIES = [], PRODUCTS = [], PMAP = {};
let tab = 'feed';
let curTheme = 'all', curType = 'all', q = '', curPCat = 'all';
let shown = 20, feedObserver = null;
const PAGE = 20;
let audio = new Audio();
let playingId = null, previewTimer = null, autoNext = true;

const $ = s => document.querySelector(s);
const pad3 = n => String(n).padStart(3, '0');
const money = n => 'NT$ ' + n.toLocaleString('en-US');

/* ================= 開場 ================= */
async function boot(){
  try{
    const [a, b] = await Promise.all([
      fetch('./stories.json', {cache:'no-store'}).then(r=>r.json()),
      fetch('./products.json', {cache:'no-store'}).then(r=>r.json()).catch(()=>[])
    ]);
    STORIES = a.sort((x,y)=>(x.sort||0)-(y.sort||0));
    PRODUCTS = b;
    PRODUCTS.forEach(p => PMAP[p.id] = p);
  }catch(e){
    $('#view').innerHTML = '<div class="empty">資料載入失敗。<br>請用 http:// 開頭網址，或直接連線上站。</div>';
    return;
  }
  buildDial(); buildChips(); render();
  setupPlayer();
  if(location.hash) handleHash();
}

/* ================= 迷你刻盤：10 個主題頻道（不是 10 篇故事） ================= */
let THEMES = [];
function collectThemes(){
  THEMES = [];
  STORIES.forEach(s=>{
    if(!THEMES.find(t=>t.key===s.categoryKey)) THEMES.push({key:s.categoryKey, name:s.categoryName, n:0});
  });
  THEMES.forEach(t=> t.n = STORIES.filter(s=>s.categoryKey===t.key).length);
}
function buildDial(){
  collectThemes();
  const d = $('#minidial'); d.innerHTML = '';
  THEMES.forEach((t,i)=>{
    const b = document.createElement('button');
    b.innerHTML = '<span>' + String(i+1).padStart(2,'0') + '</span><i></i>';
    b.title = t.name;
    b.onclick = ()=>{
      curTheme = (curTheme===t.key ? 'all' : t.key);
      shown = PAGE; buildChips(); render(); moveNeedle();
    };
    d.appendChild(b);
  });
  const n = document.createElement('div'); n.className='needle'; n.id='needle'; d.appendChild(n);
  moveNeedle();
}
function dialIndex(){
  let key = curTheme;
  if(key === 'all' && playingId){
    const s = STORIES.find(x=>x.id===playingId); if(s) key = s.categoryKey;
  }
  const i = THEMES.findIndex(t=>t.key===key);
  return i < 0 ? -1 : i;
}
function moveNeedle(){
  const btns = document.querySelectorAll('#minidial button');
  if(!btns.length) return;
  const i = dialIndex();
  btns.forEach((b,k)=>b.classList.toggle('on', k===i));
  const nd = $('#needle'); if(!nd) return;
  if(i < 0){ nd.style.opacity = '0'; return; }
  nd.style.opacity = '1';
  const r = btns[i].getBoundingClientRect(), dr = $('#minidial').getBoundingClientRect();
  nd.style.left = (r.left - dr.left + r.width/2) + 'px';
}

/* ================= 篩選 ================= */
function buildChips(){
  if(tab === 'shop'){
    const cats = [];
    PRODUCTS.filter(p=>p.active!==false).forEach(p=>{ if(!cats.includes(p.category)) cats.push(p.category); });
    const total = PRODUCTS.filter(p=>p.active!==false).length;
    $('#chips').innerHTML = [{k:'pall',label:'全部好物',n:total}]
      .concat(cats.map(c=>({k:'p:'+c, label:c, n:0})))
      .map(c=>`<button class="chip ${(c.k==='pall'&&curPCat==='all')||curPCat===c.k.slice(2)?'on':''}" data-pc="${c.k}">${c.label}${c.n?`<span class="n">${c.n}</span>`:''}</button>`).join('');
    $('#chips').querySelectorAll('.chip').forEach(el=>{
      el.onclick = ()=>{
        const k = el.dataset.pc;
        if(k==='pall') curPCat = 'all';
        else { const c = k.slice(2); curPCat = (curPCat===c ? 'all' : c); }
        buildChips(); render();
      };
    });
    return;
  }
  const themes = THEMES.length ? THEMES : [];
  if(!themes.length) collectThemes();
  const list = [
    {k:'all', label:'全部', n:STORIES.length},
    {k:'goods', label:'🛍️ 附好物', n:STORIES.filter(s=>s.productIds && s.productIds.length).length},
    {k:'pure', label:'💌 純故事', n:STORIES.filter(s=>!(s.productIds||[]).length).length},
    ...(THEMES).map(t=>({k:'t:'+t.key, label:t.name, n:t.n}))
  ];
  $('#chips').innerHTML = list.map(c=>{
    const on = (c.k==='all'&&curTheme==='all'&&curType==='all') ||
               (c.k==='goods'&&curType==='goods') || (c.k==='pure'&&curType==='pure') ||
               (c.k.startsWith('t:') && curTheme===c.k.slice(2));
    return `<button class="chip ${on?'on':''}" data-k="${c.k}">${c.label}${c.n?`<span class="n">${c.n}</span>`:''}</button>`;
  }).join('');
  $('#chips').querySelectorAll('.chip').forEach(el=>{
    el.onclick = ()=>{
      const k = el.dataset.k;
      if(k==='all'){ curTheme='all'; curType='all'; }
      else if(k==='goods'||k==='pure'){ curType = (curType===k?'all':k); }
      else { const kk = k.slice(2); curTheme = (curTheme===kk?'all':kk); }
      if(tab!=='feed'){ tab='feed'; setTab('feed'); }
      shown = PAGE; buildChips(); render();
    };
  });
}

function feedData(){
  return STORIES.filter(s=>{
    if(curTheme!=='all' && s.categoryKey!==curTheme) return false;
    const has = (s.productIds||[]).length > 0;
    if(curType==='goods' && !has) return false;
    if(curType==='pure' && has) return false;
    if(q){
      const hay = [s.title, s.excerpt, s.categoryName, s.layer1, s.layer2, String(s.sort)].join(' ');
      if(!hay.includes(q)) return false;
    }
    return true;
  });
}

/* ================= 主畫面 ================= */
function render(){
  if(tab==='feed') renderFeed();
  else if(tab==='shop') renderShop();
  else renderAbout();
}

function thumb(s, w){
  let u = s.cover || '';
  if(!u) return '';
  return u.replace(/w=\d+/, 'w=' + (w||200));
}

function renderFeed(reset){
  if(reset !== false) shown = Math.max(shown, PAGE);
  const list = feedData();
  if(!list.length){ $('#view').innerHTML = '<div class="empty">沒有符合的故事。<br>換個標籤試試。</div>'; return; }
  const slice = list.slice(0, shown);
  $('#view').innerHTML = '<div class="feed">' + slice.map(s=>{
    const has = (s.productIds||[]).length > 0;
    const p = has ? PMAP[s.productIds[0]] : null;
    const isPlaying = playingId === s.id;
    return `
    <article class="card" data-id="${s.id}">
      <div class="thumb">
        ${thumb(s,200) ? `<img loading="lazy" src="${thumb(s,200)}" alt="" onerror="this.remove()">` : ''}
        <span style="position:absolute;font-family:var(--serif);font-weight:900">${pad3(s.sort)}</span>
      </div>
      <div class="body">
        <div class="meta"><span class="num">#${pad3(s.sort)}</span><span>${s.categoryName||''}</span></div>
        <h3>${s.title||''}</h3>
        <p>${s.excerpt||''}</p>
        <div class="acts">
          <button class="playbtn ${isPlaying?'playing':''}" data-play="${s.id}">
            <span class="ic">${isPlaying?'❚❚':'▶'}</span>${isPlaying?'播放中':'15 秒試聽'}
          </button>
          ${p ? `<span class="goods">🛍 ${money(p.priceNum)}</span>` : `<span class="goods pure">💌 純故事</span>`}
        </div>
      </div>
      ${isPlaying?'<div class="prog"></div>':''}
    </article>`;
  }).join('') + `</div>
  <div id="sentinel" style="height:1px"></div>
  ${shown < list.length ? `<div class="empty" style="padding:10px 0 24px;font-size:.72rem">往下滑，還有 ${list.length - shown} 篇</div>` : `<div class="empty" style="padding:10px 0 26px;font-size:.7rem">— 這是最後一篇了 —</div>`}`;

  $('#view').querySelectorAll('.card').forEach(c=>{
    c.onclick = e=>{
      if(e.target.closest('[data-play]')) return;
      openStory(c.dataset.id);
    };
  });
  $('#view').querySelectorAll('[data-play]').forEach(b=>{
    b.onclick = e=>{ e.stopPropagation(); preview(b.dataset.play); };
  });

  if(feedObserver) feedObserver.disconnect();
  const sen = $('#sentinel');
  if(sen && shown < list.length){
    feedObserver = new IntersectionObserver(es=>{
      if(es[0].isIntersecting && shown < list.length){
        shown += PAGE; feedObserver.disconnect(); renderFeed(false);
      }
    }, {rootMargin:'300px'});
    feedObserver.observe(sen);
  }
}

function renderShop(){
  const items = PRODUCTS.filter(p=>p.active!==false && (curPCat==='all' || p.category===curPCat));
  if(!items.length){ $('#view').innerHTML='<div class="empty">好物整理中。</div>'; return; }
  $('#view').innerHTML = `<div class="shop"><div class="grid">` + items.map(p=>`
    <div class="pcard" data-pid="${p.id}">
      <div class="im">${p.img?`<img loading="lazy" src="${p.img.replace(/w=\d+/,'w=400')}" onerror="this.remove()">`:''}</div>
      <div class="in">
        <h4>${p.title||''}</h4>
        <div class="pr">${money(p.priceNum)}<small> /${p.unit||'份'}</small></div>
        <div class="sc">${(p.storyIds||[]).length} 篇故事帶路</div>
      </div>
    </div>`).join('') + `</div></div>`;
  $('#view').querySelectorAll('.pcard').forEach(c=> c.onclick = ()=> openProduct(c.dataset.pid));
}

function renderAbout(){
  $('#view').innerHTML = `<div class="empty" style="padding-top:24px">
    <div style="font-family:var(--serif);font-size:1.1rem;color:#f0dcb4;font-weight:900;margin-bottom:10px">恩典電台</div>
    每天早上六點半，一杯熱咖啡，<br>一個人的故事，一段聖經的話。<br><br>
    故事聽完，好物就在旁邊。<br>不需要，就只是聽。<br><br>
    <span style="font-size:.7rem">目前 ${STORIES.length} 個故事・${PRODUCTS.filter(p=>p.active!==false).length} 樣好物</span>
    <div style="margin-top:18px"><a href="/qr.html" style="color:#e8ce7a;font-size:.82rem">🖨 列印咖啡包 QR 貼紙</a></div>
  </div>`;
}

/* ================= 播放 ================= */
function setupPlayer(){
  audio.addEventListener('loadedmetadata', ()=>{
    const d = $('#spDur');
    if(d && playingId){ const s = STORIES.find(x=>x.id===playingId); d.textContent = '00:00 / ' + fmt(audio.duration); }
  });
  audio.addEventListener('timeupdate', ()=>{
    const bar = document.querySelector('.card[data-id="'+playingId+'"] .prog');
    if(bar && audio.duration) bar.style.width = (audio.currentTime/audio.duration*100)+'%';
    $('#pbSeek').style.width = audio.duration ? (audio.currentTime/audio.duration*100)+'%' : '0';
    $('#pbTime').textContent = fmt(audio.currentTime);
    const t = $('#spTrack'); if(t && audio.duration) t.style.width = (audio.currentTime/audio.duration*100)+'%';
    const d = $('#spDur'); if(d) d.textContent = fmt(audio.currentTime)+' / '+fmt(audio.duration);
  });
  audio.addEventListener('ended', ()=>{
    if(autoNext){ nextStory(); } else { stopAll(); }
  });
}
const fmt = t => { if(!isFinite(t)||isNaN(t)) return '00:00'; const m=Math.floor(t/60), s=Math.floor(t%60); return String(m).padStart(2,'0')+':'+String(s).padStart(2,'0'); };

function playStory(id, preview15){
  const s = STORIES.find(x=>x.id===id); if(!s) return;
  clearTimeout(previewTimer);
  if(playingId === id && !audio.paused && !preview15){ audio.pause(); refreshPlaying(); return; }
  audio.src = s.mp3File;
  audio.currentTime = 0;
  audio.play().catch(()=>{});
  playingId = id;
  $('#playerbar').classList.add('show');
  $('#pbTitle').textContent = '#' + pad3(s.sort) + '　' + (s.title||'').slice(0,14) + '…';
  $('#curNo').textContent = '#' + pad3(s.sort);
  $('#ticker').innerHTML = '正在播 #' + pad3(s.sort) + '　<b>' + (s.title||'') + '</b>';
  moveNeedle(); refreshPlaying();
  if(preview15){
    previewTimer = setTimeout(()=>{
      audio.pause();
      refreshPlaying();
      $('#ticker').innerHTML = '試聽 15 秒結束，點卡片聽全文';
    }, 15000);
  }
}
function preview(id){ playStory(id, true); }

function refreshPlaying(){
  document.querySelectorAll('[data-play]').forEach(b=>{
    const on = b.dataset.play === playingId && !audio.paused;
    b.classList.toggle('playing', on);
    b.innerHTML = `<span class="ic">${on?'❚❚':'▶'}</span>${on?'播放中':'15 秒試聽'}`;
  });
  const bp = $('#pbPlay'); if(bp) bp.textContent = audio.paused ? '▶' : '⏸';
  const sp = $('#spBig'); if(sp) sp.textContent = audio.paused ? '▶' : '❚❚';
}
function stopAll(){ audio.pause(); refreshPlaying(); }
function nextStory(){
  const list = feedData();
  let i = list.findIndex(s=>s.id===playingId);
  if(i < 0) i = 0;
  const n = list[(i+1) % list.length];
  if(n){ playStory(n.id, false); }
}

$('#pbPlay').onclick = ()=>{ if(audio.paused){ audio.play().catch(()=>{}); } else { audio.pause(); } refreshPlaying(); };

/* ================= 故事內頁 ================= */
function openStory(id){
  const s = STORIES.find(x=>x.id===id); if(!s) return;
  const prods = (s.productIds||[]).map(pid=>PMAP[pid]).filter(Boolean);
  $('#pageTitle').textContent = '#' + pad3(s.sort) + '　' + (s.categoryName||'');
  $('#storyBody').innerHTML = `
    <div class="sthead">
      <span class="no">#${pad3(s.sort)}</span><span class="cat">${s.categoryName||''}</span>
      <h1>${s.title||''}</h1>
      <p class="ex">${s.excerpt||''}</p>
      <div class="audiorow">
        <button class="big" id="spBig">▶</button>
        <div class="track"><i id="spTrack"></i></div>
        <span class="dur" id="spDur">00:00 / 00:00</span>
      </div>
      <div style="display:flex;align-items:center;gap:10px;justify-content:space-between;margin-top:8px">
        <button class="sharebtn" id="spShare">🔗 分享這一集</button>
        <label class="auto"><input type="checkbox" id="spAuto" ${autoNext?'checked':''}>聽完自動播下一篇</label>
      </div>
    </div>

    <div class="layer"><span class="tag">第 一 段</span><br>${s.layer1||''}</div>
    <div class="layer"><span class="tag">第 二 段</span><br>${s.layer2||''}</div>

    ${prods.length ? prods.map(p=>`
      <div class="inline">
        <div class="stamp">今天<br>有貨</div>
        <div class="lbl">工 商 服 務</div>
        <div class="row">
          <div class="pic">${p.img?`<img src="${p.img.replace(/w=\d+/,'w=200')}" onerror="this.remove()">`:''}</div>
          <div style="flex:1;min-width:0">
            <h4>${p.title||''}</h4>
            <div class="price">${money(p.priceNum)} <small>/${p.unit||'份'}</small></div>
          </div>
        </div>
        <button class="go" onclick="event.stopPropagation();openProduct('${p.id}')">看這件好物 →</button>
      </div>`).join('') : ''}

    ${s.layer3 ? `<div class="layer"><span class="tag">${prods.length?'第 三 段・工商服務':'第 三 段'}</span><br>${s.layer3}</div>` : ''}
    <div class="scripture">${s.scripture||''}</div>
    <div style="height:10px"></div>
  `;
  const page = $('#storyPage');
  page.classList.add('show'); page.scrollTop = 0;
  if(location.hash !== '#/story/' + id) history.pushState({page:'story', id}, '', '#/story/' + id);
  $('#spBig').onclick = ()=>{ playStory(s.id, false); };
  $('#spShare').onclick = async ()=>{
    const url = location.origin + '/s/' + s.sort + '.html';
    const data = { title: '#' + pad3(s.sort) + ' ' + s.title, text: s.excerpt || '', url };
    try{
      if(navigator.share){ await navigator.share(data); return; }
      await navigator.clipboard.writeText(url);
      $('#ticker').textContent = '分享網址已複製，貼到 LINE 就會有圖';
    }catch(e){ $('#ticker').textContent = url; }
  };
  $('#spAuto').onchange = e=>{ autoNext = e.target.checked; };
  playStory(s.id, false);
}

/* ================= 商品內頁 ================= */
function openProduct(pid){
  const p = PMAP[pid]; if(!p) return;
  const sts = (p.storyIds||[]).map(id=>STORIES.find(s=>s.id===id)).filter(Boolean);
  $('#productBody').innerHTML = `
    <div class="pcard" style="cursor:default">
      <div class="im" style="aspect-ratio:4/3">${p.img?`<img src="${p.img.replace(/w=\d+/,'w=700')}" onerror="this.remove()">`:''}</div>
      <div class="in" style="padding:15px">
        <div style="font-size:.66rem;color:var(--ink-3);letter-spacing:.1em;margin-bottom:6px">${p.tag||''}</div>
        <h4 style="-webkit-line-clamp:unset;min-height:0;font-size:1rem;line-height:1.5">${p.title||''}</h4>
        <div class="pr" style="font-size:1.2rem;margin:8px 0">${money(p.priceNum)}<small> /${p.unit||'份'}</small></div>
        <div style="font-size:.78rem;color:var(--ink-2);line-height:1.75">${p.desc||''}</div>
      </div>
    </div>
    ${(p.features||[]).length ? `<div class="layer" style="margin-top:12px">
      <span class="tag">好 物 特 點</span><br>
      <ul style="margin:0;padding-left:16px;font-size:.82rem;line-height:1.9">
        ${p.features.map(f=>`<li>${f}</li>`).join('')}
      </ul></div>` : ''}
    ${sts.length ? `<div style="color:#c8a97c;font-size:.72rem;letter-spacing:.12em;margin-top:18px">帶你走到這件好物的故事</div>
      <div class="rel">${sts.map(s=>`<div class="r" onclick="closePage();setTimeout(()=>openStory('${s.id}'),260)">
        <div class="n">#${pad3(s.sort)}</div><div class="tt">${s.title||''}</div></div>`).join('')}</div>` : ''}
    <div style="height:8px"></div>`;
  const page = $('#productPage');
  page.classList.add('show'); page.scrollTop = 0;
  $('#fixcta').classList.add('show');
  if(location.hash !== '#/product/' + pid) history.pushState({page:'product', pid}, '', '#/product/' + pid);
}

/* ================= 導覽 ================= */
function setTab(t){
  tab = t;
  document.querySelectorAll('.tabbar .tab').forEach(b=>b.classList.toggle('on', b.dataset.tab===t));
  window.scrollTo({top:0, behavior:'smooth'});
}
document.querySelectorAll('.tabbar .tab').forEach(b=>{
  b.onclick = ()=>{
    setTab(b.dataset.tab); buildChips(); render();
    if(b.dataset.tab === 'shop'){ if(location.hash) history.pushState({}, '', '#/shop'); }
    else if(location.hash) history.pushState({}, '', location.pathname);
  };
});

function closePage(){
  document.querySelectorAll('.page.show').forEach(p=>p.classList.remove('show'));
  $('#fixcta').classList.remove('show');
}
window.addEventListener('popstate', ()=> handleHash(true));

function handleHash(fromPop){
  const h = location.hash || '';
  let m;
  if((m = h.match(/^#\/story\/(.+)$/))){ openStory(decodeURIComponent(m[1])); return; }
  if((m = h.match(/^#\/product\/(.+)$/))){ openProduct(decodeURIComponent(m[1])); return; }
  if(h === '#/shop'){ setTab('shop'); buildChips(); render(); return; }
  closePage();
}

function lineCta(){
  $('#ticker').textContent = '正式站會直接開啟 LINE 官方帳號加好友';
}

/* ================= 大字 ================= */
/* 字級：預設 / 大 / 特大，記在瀏覽器 */
const SZ_CLASSES = ['', 'sz-l', 'sz-xl'];
const SZ_NAMES = ['預設', '大', '特大'];
let szLevel = Number(localStorage.getItem('tts_sz') || 0);
if (isNaN(szLevel) || szLevel < 0 || szLevel > 2) szLevel = 0;
const _q = new URLSearchParams(location.search).get('sz');
if (_q === 'l') szLevel = 1; else if (_q === 'xl') szLevel = 2;
function applySize(){
  document.documentElement.className = SZ_CLASSES[szLevel];
  localStorage.setItem('tts_sz', szLevel);
  const b = $('#aabtn');
  if (b) b.textContent = szLevel === 0 ? '字體' : SZ_NAMES[szLevel];
}
$('#aabtn').onclick = ()=>{
  szLevel = (szLevel + 1) % 3;
  applySize();

  const t = $('#ticker');
  if (t) {
    t.textContent = `字級：${SZ_NAMES[szLevel]}${szLevel < 2 ? '（再按一次再放大）' : '（按一次回到預設）'}`;
    clearTimeout(window._szTimer);
    window._szTimer = setTimeout(()=>{ moveNeedle(); }, 2400);
  }
};
applySize();

/* 第一次來的長輩，給一次提示 */
(function(){
  if (localStorage.getItem('tts_sz_hint')) return;
  const row = document.querySelector('.tickrow');
  if (!row) return;
  const tip = document.createElement('div');
  tip.className = 'szhint';
  tip.textContent = '字太小？按「字體」可以放大';
  row.appendChild(tip);
  const hide = ()=>{ tip.remove(); localStorage.setItem('tts_sz_hint','1'); };
  setTimeout(hide, 9000);
  $('#aabtn').addEventListener('click', hide, {once:true});
})();

window.addEventListener('resize', moveNeedle);
boot();
</script>

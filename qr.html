<!DOCTYPE html>
<html lang="zh-Hant-TW">
<head>
<meta charset="UTF-8">
<link rel="icon" href="./favicon.ico" sizes="any">
<link rel="icon" type="image/png" sizes="32x32" href="./favicon-32.png">
<link rel="apple-touch-icon" sizes="180x180" href="./apple-touch-icon.png">
<meta name="msapplication-TileColor" content="#2a1710">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>咖啡包 QR 貼紙｜列印用</title>
<style>
  :root{--ink:#2b1a0e; --line:#d8c8ad; --red:#b23a2b; --cream:#fbf6ea}
  *{box-sizing:border-box}
  body{margin:0;background:#efe7d8;color:var(--ink);font-family:"Noto Sans TC","PingFang TC",system-ui,sans-serif}
  .bar{position:sticky;top:0;z-index:5;background:#2a1710;color:#f0dcb4;padding:12px 18px;display:flex;align-items:center;gap:14px;flex-wrap:wrap}
  .bar h1{font-size:16px;margin:0;font-weight:700;letter-spacing:.06em}
  .bar .hint{font-size:12.5px;color:#c8a97c}
  .bar button{margin-left:auto;background:#c9a227;border:0;border-radius:8px;padding:9px 16px;font:inherit;font-weight:700;cursor:pointer;color:#2a1710}
  .sheet{width:210mm;margin:16px auto;background:#fff;padding:10mm;box-shadow:0 8px 30px rgba(0,0,0,.18)}
  .grid{display:grid;grid-template-columns:1fr 1fr 1fr;gap:6mm}
  .cell{border:1px dashed var(--line);border-radius:3mm;padding:5mm 4mm;text-align:center;break-inside:avoid;page-break-inside:avoid}
  .cell .no{font-family:"Noto Serif TC",serif;font-weight:900;color:var(--red);font-size:11pt;letter-spacing:.06em}
  .cell img{width:100%;max-width:38mm;display:block;margin:2mm auto}
  .cell .t{font-size:8.5pt;line-height:1.45;height:2.9em;overflow:hidden;color:#4a3528}
  .cell .t span{display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
  .cell .s{font-size:7pt;color:#8a6b4a;margin-top:1.5mm;letter-spacing:.1em}
  .foot{text-align:center;font-size:10px;color:#8a6b4a;margin:10px 0 30px}
  @media print{
    body{background:#fff}
    .bar,.foot{display:none}
    .sheet{width:auto;margin:0;padding:8mm;box-shadow:none}
    .cell{border-color:#bbb}
    @page{size:A4;margin:8mm}
  }
</style>
</head>
<body>
<div class="bar">
  <h1>咖啡包 QR 貼紙</h1>
  <span class="hint">A4 三欄，10 張。貼在 10×12cm 咖啡包背面，掃了直達該集故事。</span>
  <button onclick="window.print()">🖨 列印 / 存 PDF</button>
</div>
<div class="sheet"><div class="grid" id="grid"></div></div>
<div class="foot">光碼電台・歲月恩典館　／　列印建議：實際大小 100%、紙張 A4、邊界預設</div>

<script>
(async function(){
  try{
    const res = await fetch('./stories.json', {cache:'no-store'});
    const list = (await res.json()).sort((a,b)=>(a.sort||0)-(b.sort||0));
    document.getElementById('grid').innerHTML = list.map(s=>{
      const n = String(s.sort).padStart(2,'0');
      return `<div class="cell">
        <div class="no">#${String(s.sort).padStart(3,'0')}</div>
        <img src="./images/qr/${n}_qr.png" alt="#${s.sort} QR">
        <div class="t">${(s.title||'').split('：')[0]}</div>
        <div class="s">掃我聽故事</div>
      </div>`;
    }).join('');
  }catch(e){
    document.getElementById('grid').innerHTML = '<p>資料載入失敗，請用 http:// 開啟。</p>';
  }
})();
</script>
</body>
</html>

<!DOCTYPE html>
<html lang="zh-Hant-TW">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>九條聲線試聽｜光碼電台</title>
<link rel="icon" href="./favicon.ico" sizes="any">
<link rel="apple-touch-icon" sizes="180x180" href="./apple-touch-icon.png">
<style>
*{box-sizing:border-box}
body{margin:0;color:#f6ecdc;font-family:"Noto Sans TC","PingFang TC",system-ui,sans-serif;
  background-color:#1b1008;background-image:url("./images/wood_tile.jpg");background-size:380px auto;min-height:100vh;padding:18px 14px 40px}
body::before{content:"";position:fixed;inset:0;background:linear-gradient(180deg,rgba(0,0,0,.15),rgba(0,0,0,.5));pointer-events:none}
.wrap{position:relative;z-index:1;max-width:560px;margin:0 auto}
h1{font-family:"Noto Serif TC",serif;font-size:1.24rem;margin:6px 0 4px;letter-spacing:.04em;color:#fff6dd}
.lead{font-size:.86rem;line-height:1.7;color:#e2c69a;margin:0 0 14px}
.sent{background:linear-gradient(180deg,#fdf7e9,#f2e5cb);color:#2b1a0e;border-radius:10px;padding:13px 15px;
  font-size:.9rem;line-height:1.8;margin-bottom:16px;border:1px solid #c9a227}
.sent b{color:#a02a1e}
.item{display:flex;align-items:center;gap:11px;background:linear-gradient(180deg,#fdf7e9,#f2e5cb);color:#2b1a0e;
  border-radius:12px;padding:11px 13px;margin-bottom:10px;border:1px solid rgba(120,84,40,.35);
  box-shadow:0 6px 16px rgba(0,0,0,.4)}
.no{flex:0 0 34px;width:34px;height:34px;border-radius:50%;background:#b23a2b;color:#fff6e6;
  display:flex;align-items:center;justify-content:center;font-family:"Noto Serif TC",serif;font-weight:900;font-size:.9rem}
.info{flex:1;min-width:0}
.name{font-family:"Noto Serif TC",serif;font-weight:900;font-size:.98rem}
.tag{font-size:.74rem;color:#7d5f3d;margin-top:2px}
audio{width:100%;margin-top:8px}
.note{margin-top:18px;background:rgba(0,0,0,.35);border:1px solid rgba(201,162,39,.4);border-radius:10px;
  padding:13px 15px;font-size:.84rem;line-height:1.8;color:#f0dcb4}
</style>
</head>
<body>
<div class="wrap">
  <h1>九條聲線試聽</h1>
  <p class="lead">同一句話，九條聲線各唸一次（約 17–23 秒）。聽完只要告訴我兩件事：<b>哪幾條是大陸腔</b>、<b>哪一條最像台灣電台主持人</b>。</p>

  <div class="sent">「各位聽眾朋友，晚上好，我是阿光。今天要說的，是一位七十六歲的老牧師，他每天早上六點半，都會泡一杯熱咖啡，放在對面那張空著的藤椅前。」</div>

  <div id="list"></div>

  <div class="note">
    <b>為什麼要挑聲音：</b>200 集要聽起來像同一個主持人，這是品牌資產。挑定 1–2 條之後，我就把它寫死成預設，之後每一集都用同一條。
  </div>
</div>

<script>
const VOICES = [
  ['01_vivian','Vivian','溫暖自然女聲'],
  ['02_uncle_fu','Uncle Fu','低沉厚實男聲'],
  ['03_serena','Serena','清澈溫柔女聲'],
  ['04_ryan','Ryan','明亮穩重男聲'],
  ['05_aiden','Aiden','年輕自然男聲'],
  ['06_ono_anna','Ono Anna','輕柔女聲'],
  ['07_sohee','Sohee','甜淨女聲'],
  ['08_eric','Eric','成熟男聲'],
  ['09_dylan','Dylan','低沉男聲']
];
document.getElementById('list').innerHTML = VOICES.map(([f,name,tag],i)=>`
  <div class="item">
    <div class="no">${i+1}</div>
    <div class="info">
      <div class="name">${name}</div>
      <div class="tag">${tag}</div>
      <audio controls preload="none" src="./audio/9vo/${f}.mp3"></audio>
    </div>
  </div>`).join('');
</script>
</body>
</html>

<!doctype html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="robots" content="noindex">
<title>查我的訂單｜光碼電台</title>
<style>
  :root { --ink:#2b2118; --muted:#8a7c6d; --line:#e6ddd2; --accent:#8a5a2b; --ok:#2f6b45; --warn:#a3311d; }
  * { box-sizing:border-box; }
  body { margin:0; padding:22px 16px 60px; font:17px/1.7 -apple-system,"PingFang TC","Noto Sans TC",sans-serif; background:#f6f1e9; color:var(--ink); }
  main { max-width:520px; margin:0 auto; }
  h1 { font-size:22px; margin:0 0 6px; }
  .lead { color:var(--muted); font-size:15px; margin-bottom:18px; }
  .bar { display:flex; gap:8px; }
  input { flex:1; font:inherit; padding:12px 14px; border:1px solid var(--line); border-radius:12px; background:#fffdf9; text-transform:uppercase; }
  button { font:inherit; padding:12px 18px; border:0; border-radius:12px; background:var(--accent); color:#fff; cursor:pointer; }
  button:disabled { opacity:.5; }
  .card { background:#fffdf9; border:1px solid var(--line); border-radius:14px; padding:16px 18px; margin-top:16px; }
  .steps { display:flex; gap:6px; margin:10px 0 14px; }
  .step { flex:1; text-align:center; font-size:12px; padding:8px 2px; border-radius:8px; background:#efe6d8; color:var(--muted); }
  .step.on { background:var(--accent); color:#fff; font-weight:700; }
  .step.dead { background:#e8cdc6; color:#7a2e1c; }
  table { width:100%; border-collapse:collapse; font-size:15px; }
  td { padding:6px 0; border-bottom:1px solid var(--line); vertical-align:top; }
  tr:last-child td { border-bottom:0; }
  .total { font-size:22px; font-weight:800; }
  .err { color:var(--warn); }
  .muted { color:var(--muted); font-size:14px; }
  a.back { display:inline-block; margin-top:18px; color:var(--accent); text-decoration:none; }
</style>
</head>
<body>
<main>
  <h1>查我的訂單</h1>
  <p class="lead">輸入結帳時拿到的訂單編號（像 <b>GC20261122-C44HGZ</b>），就看你這張單到哪裡了。</p>

  <div class="bar">
    <input id="no" placeholder="GC20261122-C44HGZ" autocomplete="off" autocapitalize="characters">
    <button id="go">查</button>
  </div>

  <div id="out"></div>

  <a class="back" href="/">← 回電台首頁</a>
</main>

<script>
const API = 'https://grace-order-api.difly.workers.dev';
const $ = (id) => document.getElementById(id);
const money = (n) => 'NT$' + Number(n || 0).toLocaleString('zh-TW');
const esc = (s) => String(s == null ? '' : s).replace(/[&<>"]/g, (c) => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[c]));

const STEPS = [
  { k: 'new', t: '已下單' },
  { k: 'paid', t: '已收款' },
  { k: 'shipped', t: '已出貨' },
  { k: 'done', t: '完成' },
];

const saved = localStorage.getItem('grace_last_order');
if (saved) $('no').value = saved;

async function go() {
  const no = $('no').value.trim().toUpperCase();
  if (!no) { $('out').innerHTML = '<p class="err">先輸入訂單編號。</p>'; return; }
  $('go').disabled = true;
  $('out').innerHTML = '<p class="muted">查詢中…</p>';
  try {
    const r = await fetch(`${API}/api/track?no=${encodeURIComponent(no)}`);
    const d = await r.json();
    if (!d.ok) throw new Error(d.message || '查不到');
    localStorage.setItem('grace_last_order', no);
    render(d.order);
  } catch (e) {
    $('out').innerHTML = '<p class="err">' + esc(e.message) + '</p>';
  }
  $('go').disabled = false;
}

function render(o) {
  const cancelled = o.status === 'cancelled';
  const idx = STEPS.findIndex((s) => s.k === o.status);

  const steps = cancelled
    ? '<div class="steps"><div class="step dead">這張單已取消</div></div>'
    : '<div class="steps">' + STEPS.map((s, i) =>
        `<div class="step ${i <= idx ? 'on' : ''}">${s.t}</div>`).join('') + '</div>';

  const rows = (o.items || []).map((i) => `
    <tr><td>${esc(i.name)}<div class="muted">× ${i.qty}</div></td>
        <td style="text-align:right">${money(i.amount)}</td></tr>`).join('');

  $('out').innerHTML = `
    <div class="card">
      <div class="muted">訂單編號</div>
      <div style="font-size:18px;font-weight:800">${esc(o.id)}</div>
      <div class="muted">下單時間：${esc((o.created_at || '').replace('T', ' ').slice(0, 16))}</div>
      ${steps}
      <table>${rows}</table>
      <div style="margin-top:10px" class="muted">小計 ${money(o.subtotal)}${o.discount ? '　折扣 −' + money(o.discount) : ''}　運費 ${o.shipping ? money(o.shipping) : '免運'}</div>
      <div class="total">${money(o.total)}</div>
    </div>`;
}

$('go').onclick = go;
$('no').addEventListener('keydown', (e) => { if (e.key === 'Enter') go(); });
if (saved) go();
</script>
</body>
</html>
